<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>検索 | 日本アニメ総合検索</title>
  <link rel="stylesheet" href="../assets/css/common.css" />
  <link rel="stylesheet" href="../assets/css/search.css" />
</head>
<body data-page="search">
  <header class="site-header">
    <a class="brand" href="../" aria-label="日本アニメ総合検索 ホーム">
      <span class="brand-mark">あ</span><span class="brand-text">日本アニメ総合検索</span>
    </a>
    <nav class="desktop-nav" aria-label="メインナビゲーション">
      <a class="active" href="./" aria-current="page">検索</a>
      <a href="../all/">全作品</a>
    </nav>
  </header>

  <main class="section-shell page-main">
    <div class="page-heading">
      <span class="eyebrow">SEARCH</span>
      <h1>アニメを検索</h1>
      <p>自由検索と詳しい条件を組み合わせて、保存されている情報を横断して探せる画面です。</p>
    </div>

    <section class="search-panel card-surface" aria-labelledby="search-panel-title">
      <h2 id="search-panel-title" class="sr-only">検索条件</h2>

      <form id="search-form" novalidate>
        <div class="search-box large">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <label class="sr-only" for="search-query">検索語</label>
          <input id="search-query" name="q" type="search" placeholder="作品名・声優・制作会社・スタッフなど" autocomplete="off" />
          <button id="search-button" type="submit">検索</button>
        </div>

        <div id="active-filters" class="active-filters" aria-live="polite"></div>

        <button class="detail-toggle" id="detail-toggle" type="button" aria-expanded="false" aria-controls="detail-filters">
          <span aria-hidden="true">＋</span> 詳しい条件を指定
        </button>

        <div id="detail-filters" class="detail-filters" hidden>
          <div class="filter-head">
            <div>
              <strong>詳しい条件</strong>
              <small>必要な項目だけ選んで使えます。</small>
            </div>
            <button id="clear-search-ui" class="clear-button" type="button">条件をクリア</button>
          </div>

          <div class="filter-section">
            <h3>条件の組み合わせ</h3>
            <div class="segmented" role="group" aria-label="条件の組み合わせ">
              <button type="button" class="selected" data-op="AND" aria-pressed="true">AND</button>
              <button type="button" data-op="OR" aria-pressed="false">OR</button>
              <button type="button" data-op="NOT" aria-pressed="false">NOT</button>
            </div>
          </div>

          <div class="filter-section">
            <h3>検索項目</h3>
            <div class="filter-grid" aria-label="詳細検索カテゴリ">
              <button type="button" class="filter-chip" data-filter="media" aria-pressed="false">媒体</button>
              <button type="button" class="filter-chip" data-filter="date" aria-pressed="false">年代・期間</button>
              <button type="button" class="filter-chip" data-filter="genre" aria-pressed="false">ジャンル</button>
              <button type="button" class="filter-chip" data-filter="studio" aria-pressed="false">制作会社</button>
              <button type="button" class="filter-chip" data-filter="staff" aria-pressed="false">スタッフ</button>
              <button type="button" class="filter-chip" data-filter="cast" aria-pressed="false">声優</button>
              <button type="button" class="filter-chip" data-filter="original" aria-pressed="false">原作</button>
              <button type="button" class="filter-chip" data-filter="music" aria-pressed="false">音楽</button>
              <button type="button" class="filter-chip" data-filter="broadcast" aria-pressed="false">放送</button>
              <button type="button" class="filter-chip" data-filter="streaming" aria-pressed="false">配信</button>
            </div>
            <p class="filter-help">カテゴリを選択すると、その項目だけを対象に検索できます。条件の組み合わせは AND / OR / NOT から選べます。</p>
          </div>
        </div>
      </form>

      <div id="search-ui-message" class="ui-message info" hidden aria-live="polite"></div>
    </section>

    <section class="results-section" aria-labelledby="results-title">
      <div class="results-toolbar">
        <div>
          <strong id="results-title">検索条件を入力してください</strong>
          <small id="result-note">検索結果はここに表示されます</small>
        </div>
        <div class="sort-controls">
          <label for="sort-key">並び替え
            <select id="sort-key">
              <option value="season">四季順</option>
              <option value="date">年代順</option>
              <option value="title">タイトル順</option>
              <option value="studio">制作会社名順</option>
              <option value="episodes">話数順</option>
              <option value="runtime">総時間順</option>
            </select>
          </label>
          <button id="sort-direction" type="button" data-dir="asc" aria-label="昇順・降順切り替え">↑ 昇順</button>
        </div>
      </div>

      <div id="results" class="anime-grid" aria-live="polite" aria-busy="false">
        <div class="empty-state card-surface">
          <div class="empty-icon" aria-hidden="true">⌕</div>
          <h2>探したい条件を入れてみよう</h2>
          <p>自由検索でも、詳しい条件からでも検索できます。</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer"><span>日本アニメ総合検索</span></footer>
  <nav class="mobile-nav" aria-label="モバイルナビゲーション">
    <a href="../"><span aria-hidden="true">⌂</span>ホーム</a>
    <a class="active" href="./" aria-current="page"><span aria-hidden="true">⌕</span>検索</a>
    <a href="../all/"><span aria-hidden="true">▦</span>全作品</a>
  </nav>
  <script src="../assets/js/common.js"></script>
  <script src="../assets/js/wasm-runtime.js"></script>
  <script src="../assets/js/search-bridge.js"></script>
</body>
</html>
