name: Temporary Information Depth Dry Run

on:
  push:
    branches:
      - fix/anime-information-depth-20260911
    paths:
      - '.github/workflows/depth-dry-run.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Diagnose focused candidate and corroboration URLs
        run: |
          node --input-type=module <<'NODE'
          import { loadDiscoveryState } from './tools/discovery/state.mjs';
          import { promoteCorroborationFrontier } from './tools/discovery/depth-control.mjs';
          import { normalizeTitleKey } from './tools/discovery/html.mjs';
          import {
            candidateInformationReadiness,
            confirmedInformationFields,
            observedInformationFields,
            corroborationPriorityBoost
          } from './tools/discovery/research-completion.mjs';
          import { sourceFamilyKey } from './tools/discovery/source-family.mjs';

          const state = loadDiscoveryState('crawler/state.json');
          const focus = promoteCorroborationFrontier(state);
          const candidate = (state.candidates || []).find((item) => normalizeTitleKey(item?.title || item?.key) === focus.focusCandidateKey);
          if (!candidate) throw new Error(`focus candidate missing: ${focus.focusCandidateKey}`);

          const focused = (state.frontier || [])
            .filter((entry) => (entry.candidateHints || []).some((hint) => normalizeTitleKey(hint) === focus.focusCandidateKey))
            .map((entry) => ({
              url: entry.url,
              basePriority: entry.priority,
              boost: corroborationPriorityBoost({ url: entry.url, anchor: '' }, candidate, { allowBroad: true })
            }))
            .filter((entry) => entry.boost > 0)
            .sort((a, b) => b.boost - a.boost || b.basePriority - a.basePriority || a.url.localeCompare(b.url));

          const observed = new Set(observedInformationFields(candidate));
          const evidence = (candidate.evidence || [])
            .filter((item) => observed.has(String(item?.field || '')))
            .map((item) => ({
              field: item.field,
              value: item.value,
              family: sourceFamilyKey(item.sourceUrl),
              sourceUrl: item.sourceUrl,
              rule: item.rule
            }));

          console.log(`FOCUS title: ${candidate.title}`);
          console.log(`FOCUS key: ${focus.focusCandidateKey}`);
          console.log(`FOCUS readiness: ${JSON.stringify(candidateInformationReadiness(candidate))}`);
          console.log(`FOCUS confirmed fields: ${JSON.stringify(confirmedInformationFields(candidate))}`);
          console.log(`FOCUS observed fields: ${JSON.stringify([...observed])}`);
          console.log(`FOCUS eligible frontier count: ${focused.length}`);
          console.log(`FOCUS eligible frontier: ${JSON.stringify(focused.slice(0, 50))}`);
          console.log(`FOCUS observed evidence: ${JSON.stringify(evidence.slice(0, 100))}`);
          NODE
