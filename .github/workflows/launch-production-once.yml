name: Launch Anime Production Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/launch-production-once.yml'

permissions:
  contents: write

concurrency:
  group: anime-production-launch
  cancel-in-progress: false

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DISCOVERY_MIN_DELAY_MS: '1000'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Production preflight
        run: |
          set -euo pipefail
          node tools/collect/self-test.mjs
          node tools/collect/initial-budget-self-test.mjs
          node tools/discovery/known-work-wasm-self-test.mjs
          node tools/discovery/known-work-skip-self-test.mjs
          node tools/discovery/research-strategy-self-test.mjs
          node tools/discovery/trust-calibration-self-test.mjs
          node tools/discovery/self-test.mjs
          node tools/discovery/candidate-title-self-test.mjs
          node tools/discovery/verification-link-self-test.mjs
          node tools/discovery/quality-self-test.mjs
          node tools/discovery/source-family-self-test.mjs
          node tools/discovery/common-evidence-self-test.mjs
          node tools/discovery/structured-evidence-self-test.mjs
          node tools/discovery/entity-resolution-self-test.mjs
          node tools/discovery/taxonomy-self-test.mjs
          node tools/validate/pre-gemini-audit.mjs

      - name: Learn research strategy and gather confirmed evidence
        shell: bash
        run: |
          set -euo pipefail
          ready_count() {
            node --input-type=module <<'NODE'
          import path from 'node:path';
          import { loadColumns } from './tools/csv/csv.mjs';
          import { loadDiscoveryState } from './tools/discovery/state.mjs';
          import { readyDiscoveryRecords } from './tools/discovery/to-record.mjs';
          const root = process.cwd();
          const state = loadDiscoveryState(path.join(root, 'crawler', 'state.json'));
          const columns = loadColumns(root);
          const { records } = readyDiscoveryRecords(state, columns, new Date().toISOString().slice(0, 10));
          process.stdout.write(String(records.length));
          NODE
          }

          for cycle in 1 2 3; do
            echo "=== research learning cycle ${cycle}/3 ==="
            node tools/discovery/run.mjs --max-pages 120 --max-depth 5 --per-host-limit 20
            ready="$(ready_count)"
            echo "ready records after cycle ${cycle}: ${ready}"
            if [[ "${ready}" =~ ^[1-9][0-9]*$ ]]; then
              break
            fi
          done

      - name: Build initial production CSV without Gemini
        run: node tools/collect/run.mjs --input discovery --mode initial --gemini false

      - name: Validate production data
        run: |
          if [[ -d data ]]; then
            node tools/validate/data-validator.mjs data
          else
            echo 'No record passed the confirmation gate yet; preserving learned research state only.'
          fi

      - name: Remove temporary launch workflows
        run: |
          git rm -f .github/workflows/launch-production-once.yml
          if [[ -f .github/workflows/continue-web-discovery-once.yml ]]; then
            git rm -f .github/workflows/continue-web-discovery-once.yml
          fi
          if [[ -f .github/workflows/initial-collect-dryrun-once.yml ]]; then
            git rm -f .github/workflows/initial-collect-dryrun-once.yml
          fi

      - name: Commit learned state and validated data
        shell: bash
        run: |
          set -euo pipefail
          git add crawler/state.json .github/workflows/launch-production-once.yml
          if [[ -d data ]]; then git add data; fi
          if [[ -e .github/workflows/continue-web-discovery-once.yml || -e .github/workflows/initial-collect-dryrun-once.yml ]]; then
            echo 'Temporary workflow cleanup did not complete.' >&2
            exit 1
          fi
          git add -u .github/workflows

          unexpected="$(git status --porcelain | awk '$2 != "crawler/state.json" && $2 !~ /^data\// && $2 != ".github/workflows/launch-production-once.yml" && $2 != ".github/workflows/continue-web-discovery-once.yml" && $2 != ".github/workflows/initial-collect-dryrun-once.yml" {print}')"
          if [[ -n "${unexpected}" ]]; then
            echo 'Unexpected files changed; refusing production commit.' >&2
            echo "${unexpected}" >&2
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Start anime research learning and initial production'

          base_sha="${GITHUB_SHA}"
          for attempt in 1 2 3; do
            git fetch origin main
            remote_head="$(git rev-parse origin/main)"
            if [[ "${remote_head}" != "${base_sha}" ]]; then
              if ! git diff --quiet "${base_sha}..${remote_head}" -- crawler/state.json data; then
                echo 'Production state/data advanced concurrently; refusing overwrite.' >&2
                exit 1
              fi
              git rebase origin/main
              base_sha="${remote_head}"
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          echo 'Could not publish production state without force push.' >&2
          exit 1
