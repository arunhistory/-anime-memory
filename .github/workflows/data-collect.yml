name: Anime Data Collect

on:
  workflow_dispatch:
    inputs:
      input:
        description: '入力元'
        required: true
        type: choice
        options:
          - discovery
          - api-json
        default: discovery
      mode:
        description: '収集モード'
        required: true
        type: choice
        options:
          - initial
          - quarterly
        default: initial
      year:
        description: 'quarterly時の対象年 (YYYY)'
        required: false
        type: string
      quarter:
        description: 'quarterly時の対象四半期'
        required: true
        type: choice
        options:
          - Q1
          - Q2
          - Q3
          - Q4
        default: Q1
      gemini:
        description: '概要生成にGeminiを使用する'
        required: true
        type: boolean
        default: false
      dry_run:
        description: 'CSVを生成・検証するがCommitしない（Geminiは呼ばない）'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: anime-data-write
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANIME_SOURCE_CONFIG_JSON: ${{ vars.ANIME_SOURCE_CONFIG_JSON }}
      ANIME_SOURCE_TOKEN: ${{ secrets.ANIME_SOURCE_TOKEN }}
      ANIME_GEMINI_API_KEY: ${{ secrets.ANIME_GEMINI_API_KEY }}
      ANIME_GEMINI_MODEL: ${{ vars.ANIME_GEMINI_MODEL }}
      ANIME_GEMINI_REQUEST_DELAY_MS: ${{ vars.ANIME_GEMINI_REQUEST_DELAY_MS }}
      COLLECT_INPUT: ${{ inputs.input }}
      COLLECT_MODE: ${{ inputs.mode }}
      COLLECT_YEAR: ${{ inputs.year }}
      COLLECT_QUARTER: ${{ inputs.quarter }}
      COLLECT_GEMINI: ${{ inputs.gemini }}
      COLLECT_DRY_RUN: ${{ inputs.dry_run }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Preflight self-test
        run: |
          node tools/collect/self-test.mjs
          node tools/correct/self-test.mjs
          node tools/discovery/self-test.mjs
          node tools/discovery/quality-self-test.mjs
          node tools/discovery/taxonomy-self-test.mjs
          node tools/gemini/quota-self-test.mjs
          node tools/gemini/self-test.mjs

      - name: Reserve Gemini daily budget
        if: ${{ !inputs.dry_run && inputs.gemini }}
        shell: bash
        run: |
          set -euo pipefail
          quota_json="$(node tools/gemini/quota.mjs reserve --run-id "${GITHUB_RUN_ID}" --requested 450)"
          reservation="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(String(x.reservation));' "${quota_json}")"
          quota_day="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(String(x.day));' "${quota_json}")"
          if [[ ! "${reservation}" =~ ^[1-9][0-9]*$ ]] || (( reservation > 450 )); then
            echo 'Invalid Gemini quota reservation.' >&2
            exit 1
          fi
          echo "ANIME_GEMINI_MAX_CALLS=${reservation}" >> "${GITHUB_ENV}"
          echo "GEMINI_QUOTA_DAY=${quota_day}" >> "${GITHUB_ENV}"

          git add crawler/gemini-usage.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Reserve Gemini daily budget (${GITHUB_RUN_ID})"

          base_sha="${GITHUB_SHA}"
          for attempt in 1 2 3; do
            git fetch origin main
            remote_head="$(git rev-parse origin/main)"
            if [[ "${remote_head}" != "${base_sha}" ]]; then
              if ! git diff --quiet "${base_sha}..${remote_head}" -- crawler/gemini-usage.json; then
                echo 'Gemini quota ledger advanced; refusing conflicting reservation.' >&2
                exit 1
              fi
              git rebase origin/main
              base_sha="${remote_head}"
            fi
            if git push origin HEAD:main; then
              break
            fi
            if [[ "${attempt}" == 3 ]]; then
              echo 'Could not persist Gemini quota reservation.' >&2
              exit 1
            fi
          done

      - name: Collect and build common CSV
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          args=(--input "${COLLECT_INPUT}" --mode "${COLLECT_MODE}")
          if [[ "${COLLECT_DRY_RUN}" == "true" || "${COLLECT_GEMINI}" != "true" ]]; then
            args+=(--gemini false)
          else
            if [[ -z "${ANIME_GEMINI_MAX_CALLS:-}" ]]; then
              echo 'Gemini quota was not reserved.' >&2
              exit 1
            fi
            args+=(--gemini true)
          fi
          if [[ "${COLLECT_MODE}" == "quarterly" ]]; then
            if [[ ! "${COLLECT_YEAR}" =~ ^[0-9]{4}$ ]]; then
              echo 'quarterly requires a four-digit year.' >&2
              exit 1
            fi
            args+=(--year "${COLLECT_YEAR}" --quarter "${COLLECT_QUARTER}")
          fi
          node tools/collect/run.mjs "${args[@]}"

      - name: Validate generated CSV set
        run: |
          if [[ -d data ]]; then
            node tools/validate/data-validator.mjs data
          else
            echo 'No new records; data directory was not created.'
          fi

      - name: Show dry-run diff
        if: ${{ inputs.dry_run }}
        run: git diff -- data || true

      - name: Commit validated data
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          git add data
          if git diff --cached --quiet; then
            echo 'No validated data changes to commit.'
          else
            unexpected="$(git status --porcelain | awk '$2 !~ /^data\// {print}')"
            if [[ -n "${unexpected}" ]]; then
              echo 'Collector modified files outside data/; refusing commit.' >&2
              echo "${unexpected}" >&2
              exit 1
            fi

            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "Collect validated anime data (${COLLECT_INPUT}/${COLLECT_MODE})"

            base_sha="${GITHUB_SHA}"
            for attempt in 1 2 3; do
              git fetch origin main
              remote_head="$(git rev-parse origin/main)"
              if [[ "${remote_head}" != "${base_sha}" ]]; then
                if ! git diff --quiet "${base_sha}..${remote_head}" -- data; then
                  echo 'data/ advanced after collection started; aborting to prevent duplicate/overwrite.' >&2
                  exit 1
                fi
                git rebase origin/main
                base_sha="${remote_head}"
              fi

              if git push origin HEAD:main; then
                break
              fi
              if [[ "${attempt}" == 3 ]]; then
                echo 'Could not publish validated data after safe fast-forward retries.' >&2
                exit 1
              fi
            done
          fi

      - name: Finalize Gemini daily budget
        if: ${{ !inputs.dry_run && inputs.gemini && success() }}
        shell: bash
        env:
          GEMINI_CALLS: ${{ steps.collect.outputs.gemini_calls }}
        run: |
          set -euo pipefail
          calls="${GEMINI_CALLS:-0}"
          if [[ ! "${calls}" =~ ^[0-9]+$ ]]; then
            echo 'Invalid Gemini call count; keeping conservative reservation.' >&2
            exit 1
          fi
          node tools/gemini/quota.mjs finalize \
            --run-id "${GITHUB_RUN_ID}" \
            --day "${GEMINI_QUOTA_DAY}" \
            --actual "${calls}"

          git add crawler/gemini-usage.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Finalize Gemini daily budget (${GITHUB_RUN_ID})"
          git fetch origin main
          remote_head="$(git rev-parse origin/main)"
          parent_head="$(git rev-parse HEAD^)"
          if [[ "${remote_head}" != "${parent_head}" ]]; then
            echo 'main advanced before quota finalization; keeping conservative reservation in remote state.' >&2
            exit 1
          fi
          git push origin HEAD:main
