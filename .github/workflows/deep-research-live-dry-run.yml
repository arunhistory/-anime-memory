name: Deep Research Live Dry Run

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deep-research-live-dry-run.yml'

permissions:
  contents: read

concurrency:
  group: deep-research-live-dry-run
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DISCOVERY_MIN_DELAY_MS: '1000'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Architecture self-tests
        run: |
          set -euo pipefail
          node tools/discovery/research-search-self-test.mjs
          node tools/discovery/title-driven-research-integration-self-test.mjs
          node tools/validate/pre-gemini-audit.mjs
      - name: Live dry-run against saved production state
        run: |
          set -euo pipefail
          node tools/discovery/run.mjs \
            --max-pages 1 \
            --max-research-pages 100 \
            --max-depth 12 \
            --per-host-limit 100 \
            --dry-run true
      - name: Prove no repository state was persisted
        run: |
          set -euo pipefail
          git diff --exit-code -- crawler/state.json crawler/state-shards crawler/research-cycle.json confirmed data
