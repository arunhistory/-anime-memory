name: Initial CSV Readiness Report Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/initial-csv-dryrun-once.yml'

permissions:
  contents: read

jobs:
  report:
    if: ${{ github.event.head_commit.message == 'Report discovery readiness once' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Report readiness reasons without writes
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import { discoveryCandidateReadiness } from './tools/discovery/to-record.mjs';

          const state = JSON.parse(fs.readFileSync('crawler/state.json', 'utf8'));
          const reasons = new Map();
          let ready = 0;
          for (const candidate of state.candidates || []) {
            const result = discoveryCandidateReadiness(candidate);
            if (result.ready) ready += 1;
            else reasons.set(result.reason, (reasons.get(result.reason) || 0) + 1);
            console.log(JSON.stringify({
              title: candidate.title,
              ready: result.ready,
              reason: result.reason,
              origin: candidate.facts?.origin_country?.status + ':' + (candidate.facts?.origin_country?.value || ''),
              media: candidate.facts?.media_type?.status + ':' + (candidate.facts?.media_type?.value || ''),
              titleFact: candidate.facts?.title_ja?.status + ':' + (candidate.facts?.title_ja?.value || ''),
              release: candidate.facts?.release_start?.status + ':' + (candidate.facts?.release_start?.value || ''),
              theatrical: candidate.facts?.theatrical_release_date?.status + ':' + (candidate.facts?.theatrical_release_date?.value || ''),
              studio: candidate.facts?.animation_studio?.status + ':' + (candidate.facts?.animation_studio?.value || '')
            }));
          }
          console.log('SUMMARY=' + JSON.stringify({
            total: (state.candidates || []).length,
            ready,
            skipped: [...reasons.entries()].sort((a,b) => b[1]-a[1])
          }));
          NODE
