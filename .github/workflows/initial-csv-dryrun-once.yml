name: Initial CSV Dry Run Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/initial-csv-dryrun-once.yml'

permissions:
  contents: read

jobs:
  dryrun:
    if: ${{ github.event.head_commit.message == 'Measure initial CSV readiness without Gemini' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Preflight
        run: |
          node tools/collect/self-test.mjs
          node tools/collect/initial-budget-self-test.mjs
          node tools/discovery/known-work-wasm-self-test.mjs
          node tools/discovery/source-family-self-test.mjs
          node tools/validate/pre-gemini-audit.mjs

      - name: Build runner-only initial CSV without Gemini
        run: node tools/collect/run.mjs --input discovery --mode initial --gemini false

      - name: Validate runner-only result
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d data ]]; then
            node tools/validate/data-validator.mjs data
            echo 'Generated files:'
            find data -maxdepth 1 -type f -print -exec wc -l {} \;
          else
            echo 'No data directory was produced.'
          fi
          echo 'Runner-only diff:'
          git status --short
          echo 'Nothing from this workflow is committed or pushed.'
