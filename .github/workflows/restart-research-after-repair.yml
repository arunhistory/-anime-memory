name: Restart Anime Research After Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restart-research-after-repair.yml'

permissions:
  contents: read
  actions: write

jobs:
  restart:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch repaired production cycle
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run research-production.yml --repo "${GITHUB_REPOSITORY}" --ref main -f cycle_action=start
