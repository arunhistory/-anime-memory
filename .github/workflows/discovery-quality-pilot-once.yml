name: Discovery Quality Pilot Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/discovery-quality-pilot-once.yml'

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DISCOVERY_SEED_URLS: https://ja.wikipedia.org/wiki/%E6%97%A5%E6%9C%AC%E3%81%AE%E3%83%86%E3%83%AC%E3%83%93%E3%82%A2%E3%83%8B%E3%83%A1%E4%BD%9C%E5%93%81%E4%B8%80%E8%A6%A7
      DISCOVERY_ALLOWED_HOSTS: ja.wikipedia.org
      DISCOVERY_MIN_DELAY_MS: '6000'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Discovery preflight tests
        run: |
          node tools/discovery/self-test.mjs
          node tools/discovery/quality-self-test.mjs
          node tools/discovery/common-evidence-self-test.mjs
          node tools/discovery/structured-evidence-self-test.mjs
          node tools/discovery/entity-resolution-self-test.mjs
          node tools/discovery/taxonomy-self-test.mjs

      - name: Controlled live discovery in runner only
        run: node tools/discovery/run.mjs --max-pages 14 --max-depth 3 --per-host-limit 14

      - name: Inspect runner-only admission results
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import { loadColumns } from './tools/csv/csv.mjs';
          import { readyDiscoveryRecords, discoveryCandidateReadiness } from './tools/discovery/to-record.mjs';
          const state = JSON.parse(fs.readFileSync('crawler/state.json', 'utf8'));
          const columns = loadColumns(process.cwd());
          const ready = readyDiscoveryRecords(state, columns, '2026-09-10');
          console.log(`documents=${state.documents.length}`);
          console.log(`candidates=${state.candidates.length}`);
          console.log(`ready_records=${ready.records.length}`);
          const reasons = {};
          for (const candidate of state.candidates) {
            const result = discoveryCandidateReadiness(candidate);
            if (!result.ready) reasons[result.reason] = (reasons[result.reason] || 0) + 1;
            if (result.ready && candidate.facts?.origin_country?.value !== 'JP') {
              throw new Error(`non-Japanese candidate passed admission: ${candidate.title}`);
            }
          }
          console.log(`skip_reasons=${JSON.stringify(reasons)}`);
          for (const candidate of state.candidates.slice(0, 25)) {
            console.log(JSON.stringify({
              title: candidate.title,
              origin: candidate.facts?.origin_country,
              media: candidate.facts?.media_type,
              readiness: discoveryCandidateReadiness(candidate)
            }));
          }
          NODE

      - name: Confirm repository remains read-only
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo 'Runner workspace changed only for the live pilot; nothing is committed or pushed.'
          fi
