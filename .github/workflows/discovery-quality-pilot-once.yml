name: Discovery Quality Pilot Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/discovery-quality-pilot-once.yml'

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DISCOVERY_SEED_URLS: https://ja.wikipedia.org/wiki/%E6%97%A5%E6%9C%AC%E3%81%AE%E3%83%86%E3%83%AC%E3%83%93%E3%82%A2%E3%83%8B%E3%83%A1%E4%BD%9C%E5%93%81%E4%B8%80%E8%A6%A7
      DISCOVERY_ALLOWED_HOSTS: ja.wikipedia.org
      DISCOVERY_MIN_DELAY_MS: '6000'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Discovery quality tests
        run: |
          node tools/discovery/self-test.mjs
          node tools/discovery/quality-self-test.mjs

      - name: Controlled live discovery in runner only
        run: node tools/discovery/run.mjs --max-pages 10 --max-depth 3 --per-host-limit 10

      - name: Inspect runner-only candidates
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const state = JSON.parse(fs.readFileSync('crawler/state.json', 'utf8'));
          console.log(`documents=${state.documents.length}`);
          console.log(`candidates=${state.candidates.length}`);
          for (const candidate of state.candidates.slice(0, 20)) {
            console.log(JSON.stringify({
              title: candidate.title,
              sources: candidate.sources,
              facts: candidate.facts
            }));
          }
          NODE

      - name: Confirm repository remains untouched
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo 'Runner workspace changed as expected for the read-only pilot; nothing is committed or pushed.'
          fi
