name: Discovery Evidence Join Diagnostics Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/initial-collect-dryrun-once.yml'

permissions:
  contents: read

jobs:
  diagnose:
    if: ${{ github.event.head_commit.message == 'Diagnose discovery evidence joins once' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Diagnose evidence joins
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import { discoveryCandidateReadiness } from './tools/discovery/to-record.mjs';

          const state = JSON.parse(fs.readFileSync('crawler/state.json', 'utf8'));
          const hostOf = (url) => { try { return new URL(url).hostname.toLowerCase(); } catch { return ''; } };
          const rows = [];
          const sourceHostHistogram = {};
          const originEvidenceHistogram = { none: 0, observedJP: 0, confirmedJP: 0, observedOther: 0, conflict: 0 };

          for (const candidate of state.candidates || []) {
            const readiness = discoveryCandidateReadiness(candidate);
            if (readiness.ready) continue;
            const hosts = [...new Set((candidate.sources || []).map(hostOf).filter(Boolean))];
            sourceHostHistogram[hosts.length] = (sourceHostHistogram[hosts.length] || 0) + 1;
            const origin = candidate.facts?.origin_country;
            if (!origin) originEvidenceHistogram.none += 1;
            else if (origin.status === 'conflict') originEvidenceHistogram.conflict += 1;
            else if (origin.value === 'JP' && origin.status === 'confirmed') originEvidenceHistogram.confirmedJP += 1;
            else if (origin.value === 'JP') originEvidenceHistogram.observedJP += 1;
            else originEvidenceHistogram.observedOther += 1;

            const originEvidence = (candidate.evidence || [])
              .filter((e) => e.field === 'origin_country')
              .map((e) => ({ value:e.value, host:hostOf(e.sourceUrl), sourceClass:e.sourceClass, rule:e.rule }));
            rows.push({
              title: candidate.title,
              reason: readiness.reason,
              hostCount: hosts.length,
              hosts: hosts.slice(0, 8),
              sourceCount: (candidate.sources || []).length,
              originFact: origin ? {status:origin.status,value:origin.value,hostCount:origin.hostCount,sourceCount:origin.sourceCount} : null,
              originEvidence: originEvidence.slice(0, 8),
              media: candidate.facts?.media_type ? {status:candidate.facts.media_type.status,value:candidate.facts.media_type.value} : null,
              release: candidate.facts?.release_start ? {status:candidate.facts.release_start.status,value:candidate.facts.release_start.value} : null,
              studio: candidate.facts?.animation_studio ? {status:candidate.facts.animation_studio.status,value:candidate.facts.animation_studio.value} : null
            });
          }

          rows.sort((a,b) => b.hostCount - a.hostCount || a.title.localeCompare(b.title, 'ja'));
          console.log('state=' + JSON.stringify({visited:state.visited.length,documents:state.documents.length,candidates:state.candidates.length,frontier:state.frontier.length}));
          console.log('source-host-count-histogram=' + JSON.stringify(sourceHostHistogram));
          console.log('origin-evidence-histogram=' + JSON.stringify(originEvidenceHistogram));
          console.log('top-multihost-unready=' + JSON.stringify(rows.slice(0, 25)));
          NODE
