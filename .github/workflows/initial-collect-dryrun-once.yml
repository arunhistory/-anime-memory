name: Discovery Admission Diagnostics Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/initial-collect-dryrun-once.yml'

permissions:
  contents: read

jobs:
  diagnose:
    if: ${{ github.event.head_commit.message == 'Run discovery admission diagnostics once' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Summarize admission failures
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import { discoveryCandidateReadiness } from './tools/discovery/to-record.mjs';
          const state = JSON.parse(fs.readFileSync('crawler/state.json', 'utf8'));
          const counts = new Map();
          const samples = new Map();
          for (const candidate of state.candidates || []) {
            const result = discoveryCandidateReadiness(candidate);
            const reason = result.ready ? 'ready' : result.reason;
            counts.set(reason, (counts.get(reason) || 0) + 1);
            if (!samples.has(reason)) samples.set(reason, []);
            if (samples.get(reason).length < 5) {
              const f = candidate.facts || {};
              samples.get(reason).push({
                title: candidate.title || candidate.key || '',
                origin: f.origin_country ? {status:f.origin_country.status,value:f.origin_country.value} : null,
                media: f.media_type ? {status:f.media_type.status,value:f.media_type.value} : null,
                release: f.release_start ? {status:f.release_start.status,value:f.release_start.value} : null,
                theatrical: f.theatrical_release_date ? {status:f.theatrical_release_date.status,value:f.theatrical_release_date.value} : null,
                studio: f.animation_studio ? {status:f.animation_studio.status,value:f.animation_studio.value} : null
              });
            }
          }
          console.log('candidate-count=' + (state.candidates || []).length);
          console.log('reason-counts=' + JSON.stringify(Object.fromEntries([...counts.entries()].sort())));
          for (const [reason, rows] of samples) console.log(`samples:${reason}=` + JSON.stringify(rows));
          NODE
