name: Initial Collect Dry Run Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/initial-collect-dryrun-once.yml'

permissions:
  contents: read

concurrency:
  group: anime-data-write
  cancel-in-progress: false

jobs:
  collect-dry-run:
    if: ${{ github.event.head_commit.message == 'Run initial collect dry run once' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Preflight self-tests
        run: |
          node tools/collect/self-test.mjs
          node tools/collect/initial-budget-self-test.mjs
          node tools/correct/self-test.mjs
          node tools/discovery/self-test.mjs
          node tools/discovery/quality-self-test.mjs
          node tools/discovery/common-evidence-self-test.mjs
          node tools/discovery/structured-evidence-self-test.mjs
          node tools/discovery/entity-resolution-self-test.mjs
          node tools/discovery/taxonomy-self-test.mjs
          node tools/gemini/quota-self-test.mjs
          node tools/gemini/self-test.mjs

      - name: Build common CSV without Gemini
        run: node tools/collect/run.mjs --input discovery --mode initial --gemini false

      - name: Validate generated CSV set
        run: |
          if [[ -d data ]]; then
            node tools/validate/data-validator.mjs data
          else
            echo 'No ready records produced from current discovery state.'
          fi

      - name: Inspect dry-run output
        run: |
          git status --short
          if [[ -d data ]]; then
            find data -maxdepth 1 -type f -print -exec wc -l {} \;
          fi
