name: Data Pipeline Validate

on:
  push:
    branches: [main]
    paths:
      - 'tools/csv/**'
      - 'tools/fetch/**'
      - 'tools/normalize/**'
      - 'tools/collect/**'
      - 'tools/correct/**'
      - 'tools/discovery/**'
      - 'tools/gemini/**'
      - 'tools/validate/data-validator.mjs'
      - 'crawler/**'
      - 'data/**'
      - '.github/workflows/data-pipeline-validate.yml'
      - '.github/workflows/data-collect.yml'
      - '.github/workflows/manual-anime-correction.yml'
      - '.github/workflows/web-discovery.yml'
  pull_request:
    paths:
      - 'tools/csv/**'
      - 'tools/fetch/**'
      - 'tools/normalize/**'
      - 'tools/collect/**'
      - 'tools/correct/**'
      - 'tools/discovery/**'
      - 'tools/gemini/**'
      - 'tools/validate/data-validator.mjs'
      - 'crawler/**'
      - 'data/**'
      - '.github/workflows/data-pipeline-validate.yml'
      - '.github/workflows/data-collect.yml'
      - '.github/workflows/manual-anime-correction.yml'
      - '.github/workflows/web-discovery.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript syntax check
        run: |
          node --check tools/csv/csv.mjs
          node --check tools/fetch/http-json.mjs
          node --check tools/normalize/record.mjs
          node --check tools/validate/data-validator.mjs
          node --check tools/collect/run.mjs
          node --check tools/collect/self-test.mjs
          node --check tools/correct/run.mjs
          node --check tools/correct/self-test.mjs
          node --check tools/discovery/url.mjs
          node --check tools/discovery/robots.mjs
          node --check tools/discovery/fetch-page.mjs
          node --check tools/discovery/html.mjs
          node --check tools/discovery/taxonomy.mjs
          node --check tools/discovery/taxonomy-self-test.mjs
          node --check tools/discovery/evidence.mjs
          node --check tools/discovery/to-record.mjs
          node --check tools/discovery/score.mjs
          node --check tools/discovery/index.mjs
          node --check tools/discovery/state.mjs
          node --check tools/discovery/engine.mjs
          node --check tools/discovery/run.mjs
          node --check tools/discovery/self-test.mjs
          node --check tools/discovery/quality-self-test.mjs
          node --check tools/gemini/synopsis.mjs
          node --check tools/gemini/quota.mjs
          node --check tools/gemini/quota-self-test.mjs
          node --check tools/gemini/self-test.mjs

      - name: Collection pipeline self-test
        run: node tools/collect/self-test.mjs

      - name: Manual correction self-test
        run: node tools/correct/self-test.mjs

      - name: Web discovery self-test
        run: node tools/discovery/self-test.mjs

      - name: Discovery quality self-test
        run: node tools/discovery/quality-self-test.mjs

      - name: Anime taxonomy self-test
        run: node tools/discovery/taxonomy-self-test.mjs

      - name: Gemini quota self-test
        run: node tools/gemini/quota-self-test.mjs

      - name: Gemini synopsis self-test
        run: node tools/gemini/self-test.mjs

      - name: Validate committed data when present
        run: |
          if [[ -d data ]]; then
            node tools/validate/data-validator.mjs data
          else
            echo 'data/ is not created yet; no production records to validate.'
          fi
