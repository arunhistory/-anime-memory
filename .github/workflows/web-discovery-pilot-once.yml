name: Web Discovery Pilot Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/web-discovery-pilot-once.yml'

permissions:
  contents: write

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DISCOVERY_SEED_URLS: https://ja.wikipedia.org/wiki/%E6%97%A5%E6%9C%AC%E3%81%AE%E3%83%86%E3%83%AC%E3%83%93%E3%82%A2%E3%83%8B%E3%83%A1%E4%BD%9C%E5%93%81%E4%B8%80%E8%A6%A7
      DISCOVERY_ALLOWED_HOSTS: ja.wikipedia.org
      DISCOVERY_MIN_DELAY_MS: '6000'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Discovery self-test
        run: node tools/discovery/self-test.mjs

      - name: Controlled live discovery
        run: node tools/discovery/run.mjs --max-pages 5 --max-depth 2 --per-host-limit 5

      - name: Commit first discovery state
        shell: bash
        run: |
          set -euo pipefail
          git add crawler/state.json
          if git diff --cached --quiet; then
            echo 'No discovery state changes to commit.'
            exit 0
          fi
          unexpected="$(git status --porcelain | awk '$2 != "crawler/state.json" {print}')"
          if [[ -n "${unexpected}" ]]; then
            echo 'Pilot modified files outside crawler/state.json; refusing commit.' >&2
            echo "${unexpected}" >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Bootstrap controlled anime discovery state'
          git fetch origin main
          remote_head="$(git rev-parse origin/main)"
          if [[ "${remote_head}" != "${GITHUB_SHA}" ]]; then
            if ! git diff --quiet "${GITHUB_SHA}..${remote_head}" -- crawler/state.json; then
              echo 'crawler/state.json advanced during pilot; refusing overwrite.' >&2
              exit 1
            fi
            git rebase origin/main
          fi
          git push origin HEAD:main
