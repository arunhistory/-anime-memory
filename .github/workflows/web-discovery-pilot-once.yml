name: Web Discovery Pilot Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/web-discovery-pilot-once.yml'

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DISCOVERY_SEED_URLS: https://ja.wikipedia.org/wiki/%E6%97%A5%E6%9C%AC%E3%81%AE%E3%83%86%E3%83%AC%E3%83%93%E3%82%A2%E3%83%8B%E3%83%A1%E4%BD%9C%E5%93%81%E4%B8%80%E8%A6%A7
      DISCOVERY_ALLOWED_HOSTS: ja.wikipedia.org
      DISCOVERY_MIN_DELAY_MS: '6000'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Discovery self-test
        run: node tools/discovery/self-test.mjs

      - name: Controlled live dry-run
        run: node tools/discovery/run.mjs --max-pages 5 --max-depth 2 --per-host-limit 5 --dry-run true
