name: WASM Build

on:
  push:
    branches: [main]
    paths:
      - 'wasm-src/**'
      - '.github/workflows/wasm-build.yml'
  pull_request:
    paths:
      - 'wasm-src/**'
      - '.github/workflows/wasm-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Native C++ engine test
        run: |
          c++ -std=c++17 -O3 -Wall -Wextra -Werror \
            wasm-src/shared/anime_engine.cpp \
            wasm-src/tests/engine_test.cpp \
            -o /tmp/anime-engine-test
          /tmp/anime-engine-test

      - name: Native C++ wrapper/schema test
        run: |
          c++ -std=c++17 -O3 -Wall -Wextra -Werror \
            wasm-src/shared/anime_engine.cpp \
            wasm-src/search/main.cpp \
            wasm-src/all/main.cpp \
            wasm-src/tests/wrapper_test.cpp \
            -o /tmp/anime-wrapper-test
          /tmp/anime-wrapper-test

      - name: Install Emscripten
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends emscripten
          em++ --version

      - name: Build search.wasm and all.wasm
        run: bash wasm-src/build.sh

      - name: Browser WASM ABI smoke test
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/anime-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill ${SERVER_PID} 2>/dev/null || true' EXIT
          sleep 1
          google-chrome --headless --disable-gpu --no-sandbox --virtual-time-budget=5000 \
            --dump-dom http://127.0.0.1:8765/wasm-src/tests/wasm_smoke.html \
            > /tmp/wasm-smoke-dom.txt
          cat /tmp/wasm-smoke-dom.txt
          grep -F 'wasm_smoke: PASS' /tmp/wasm-smoke-dom.txt

      - name: Upload WASM build artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: anime-wasm
          path: |
            assets/wasm/all.js
            assets/wasm/all.wasm
            assets/wasm/search.js
            assets/wasm/search.wasm
          if-no-files-found: error
          retention-days: 7

      - name: Commit verified WASM assets
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/wasm/all.js assets/wasm/all.wasm assets/wasm/search.js assets/wasm/search.wasm
          if git diff --cached --quiet; then
            echo "WASM assets are unchanged."
          else
            git commit -m "Build verified C++ WASM assets"
            git push origin HEAD:main
          fi
