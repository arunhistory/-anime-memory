name: Checkpoint Anime Research To CSV Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/checkpoint-csv-once.yml'

permissions:
  contents: write

concurrency:
  group: anime-production-launch
  cancel-in-progress: true

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest saved state
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Safety preflight
        run: |
          set -euo pipefail
          node tools/collect/self-test.mjs
          node tools/collect/initial-budget-self-test.mjs
          node tools/discovery/known-work-wasm-self-test.mjs
          node tools/discovery/known-work-skip-self-test.mjs
          node tools/discovery/research-strategy-self-test.mjs
          node tools/discovery/trust-calibration-self-test.mjs

      - name: Build CSV from last committed learned state
        run: node tools/collect/run.mjs --input discovery --mode initial --gemini false

      - name: Validate generated CSV set
        run: |
          if [[ -d data ]]; then
            node tools/validate/data-validator.mjs data
          else
            echo 'No candidate is ready for CSV registration at the saved checkpoint.'
          fi

      - name: Remove this one-shot workflow
        run: git rm -f .github/workflows/checkpoint-csv-once.yml

      - name: Commit checkpoint CSV and cleanup
        shell: bash
        run: |
          set -euo pipefail
          base_sha="$(git rev-parse HEAD)"
          git add -u .github/workflows/checkpoint-csv-once.yml
          if [[ -d data ]]; then git add data; fi

          unexpected="$(git status --porcelain | awk '$2 !~ /^data\// && $2 != ".github/workflows/checkpoint-csv-once.yml" {print}')"
          if [[ -n "${unexpected}" ]]; then
            echo 'Unexpected file changes; refusing checkpoint commit.' >&2
            echo "${unexpected}" >&2
            exit 1
          fi

          if git diff --cached --quiet; then
            echo 'No checkpoint changes to commit.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Checkpoint anime research and validated CSV'

          for attempt in 1 2 3; do
            git fetch origin main
            remote_head="$(git rev-parse origin/main)"
            if [[ "${remote_head}" != "${base_sha}" ]]; then
              if ! git diff --quiet "${base_sha}..${remote_head}" -- data .github/workflows/checkpoint-csv-once.yml; then
                echo 'Checkpoint targets advanced concurrently; refusing overwrite.' >&2
                exit 1
              fi
              git rebase origin/main
              base_sha="${remote_head}"
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          echo 'Could not publish checkpoint without force push.' >&2
          exit 1
