name: Gemini Live Smoke Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gemini-live-smoke-once.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      ANIME_GEMINI_API_KEY: ${{ secrets.ANIME_GEMINI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Probe Gemini model and generation
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const apiKey = String(process.env.ANIME_GEMINI_API_KEY || '').trim();
          if (!apiKey) throw new Error('ANIME_GEMINI_API_KEY is not configured.');
          const model = 'gemini-3.1-flash-lite';
          const headers = { 'content-type': 'application/json', 'x-goog-api-key': apiKey };

          const modelResponse = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}`, {
            method: 'GET',
            headers: { 'x-goog-api-key': apiKey },
            redirect: 'error'
          });
          console.log(`model: ${model}`);
          console.log(`model lookup status: ${modelResponse.status}`);
          if (!modelResponse.ok) process.exit(1);

          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`, {
            method: 'POST',
            headers,
            redirect: 'error',
            body: JSON.stringify({
              contents: [{ parts: [{ text: 'JSONで {"ok":true} だけを返してください。' }] }],
              generationConfig: {
                thinkingConfig: { thinkingLevel: 'minimal' },
                responseMimeType: 'application/json',
                responseJsonSchema: {
                  type: 'object',
                  properties: { ok: { type: 'boolean' } },
                  required: ['ok']
                }
              }
            })
          });
          console.log(`generateContent status: ${response.status}`);
          if (!response.ok) {
            console.error(`retry-after: ${response.headers.get('retry-after') || ''}`);
            process.exit(1);
          }

          const payload = await response.json();
          const text = payload?.candidates?.[0]?.content?.parts?.map((part) => part?.text || '').join('').trim() || '';
          const parsed = JSON.parse(text);
          if (parsed?.ok !== true) throw new Error('Unexpected Gemini response.');
          console.log('Gemini generateContent live smoke: PASS');
          NODE
