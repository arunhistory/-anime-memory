name: Candidate Verification Discovery Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/continue-web-discovery-once.yml'

permissions:
  contents: write

concurrency:
  group: web-anime-discovery
  cancel-in-progress: false

jobs:
  discover:
    if: ${{ github.event.head_commit.message == 'Run candidate verification discovery once' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DISCOVERY_MIN_DELAY_MS: '1000'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Discovery safety preflight
        run: |
          node tools/discovery/known-work-wasm-self-test.mjs
          node tools/discovery/known-work-skip-self-test.mjs
          node tools/discovery/self-test.mjs
          node tools/discovery/verification-link-self-test.mjs
          node tools/discovery/quality-self-test.mjs
          node tools/discovery/source-family-self-test.mjs
          node tools/discovery/common-evidence-self-test.mjs
          node tools/discovery/structured-evidence-self-test.mjs
          node tools/discovery/entity-resolution-self-test.mjs
          node tools/discovery/taxonomy-self-test.mjs

      - name: Continue discovery with candidate verification hints
        run: node tools/discovery/run.mjs --max-pages 200 --max-depth 5 --per-host-limit 20

      - name: Admission and evidence summary
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import { discoveryCandidateReadiness } from './tools/discovery/to-record.mjs';
          const state = JSON.parse(fs.readFileSync('crawler/state.json', 'utf8'));
          const counts = {};
          const hostCounts = {};
          for (const candidate of state.candidates || []) {
            const r = discoveryCandidateReadiness(candidate);
            const key = r.ready ? 'ready' : r.reason;
            counts[key] = (counts[key] || 0) + 1;
            const hosts = new Set((candidate.sources || []).map((url) => {
              try { return new URL(url).hostname.toLowerCase(); } catch { return ''; }
            }).filter(Boolean));
            hostCounts[hosts.size] = (hostCounts[hosts.size] || 0) + 1;
          }
          const hintedFrontier = (state.frontier || []).filter((entry) => Array.isArray(entry.candidateHints) && entry.candidateHints.length).length;
          console.log(`visited=${state.visited.length}`);
          console.log(`documents=${state.documents.length}`);
          console.log(`candidates=${state.candidates.length}`);
          console.log(`frontier=${state.frontier.length}`);
          console.log(`hintedFrontier=${hintedFrontier}`);
          console.log('candidateSourceHostHistogram=' + JSON.stringify(hostCounts));
          console.log('admission=' + JSON.stringify(counts));
          NODE

      - name: Commit discovery state only
        shell: bash
        run: |
          set -euo pipefail
          git add crawler/state.json
          if git diff --cached --quiet; then
            echo 'No discovery state changes to commit.'
            exit 0
          fi
          unexpected="$(git status --porcelain | awk '$2 != "crawler/state.json" {print}')"
          if [[ -n "${unexpected}" ]]; then
            echo 'Discovery modified files outside crawler/state.json; refusing commit.' >&2
            echo "${unexpected}" >&2
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update candidate verification discovery state'

          base_sha="${GITHUB_SHA}"
          for attempt in 1 2 3; do
            git fetch origin main
            remote_head="$(git rev-parse origin/main)"
            if [[ "${remote_head}" != "${base_sha}" ]]; then
              if ! git diff --quiet "${base_sha}..${remote_head}" -- crawler/state.json; then
                echo 'crawler/state.json advanced; refusing lost update.' >&2
                exit 1
              fi
              git rebase origin/main
              base_sha="${remote_head}"
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          echo 'Could not publish discovery state.' >&2
          exit 1
