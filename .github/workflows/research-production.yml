name: Anime Research Production

on:
  schedule:
    - cron: '17 0 1 1,4,7,10 *'
  workflow_dispatch:
    inputs:
      cycle_action:
        description: 'startは新しい探索周期、continueは保存済み周期の継続'
        required: true
        type: choice
        options:
          - start
          - continue
        default: start

permissions:
  contents: write
  actions: write

concurrency:
  group: anime-production-cycle
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DISCOVERY_MIN_DELAY_MS: '1000'
      CYCLE_ACTION: ${{ inputs.cycle_action || 'start' }}

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Production preflight
        run: |
          set -euo pipefail
          node tools/collect/self-test.mjs
          node tools/collect/enrichment-self-test.mjs
          node tools/collect/series-enrichment-self-test.mjs
          node tools/collect/initial-pending-self-test.mjs
          node tools/collect/package-integration-self-test.mjs
          node tools/discovery/cycle-self-test.mjs
          node tools/discovery/state-sharding-self-test.mjs
          node tools/discovery/research-cursor-state-self-test.mjs
          node tools/discovery/web-search-index-self-test.mjs
          node tools/discovery/indexed-fetcher-self-test.mjs
          node tools/discovery/research-search-self-test.mjs
          node tools/discovery/frontier-priority-self-test.mjs
          node tools/discovery/known-work-wasm-self-test.mjs
          node tools/discovery/known-work-skip-self-test.mjs
          node tools/discovery/research-strategy-self-test.mjs
          node tools/discovery/research-completion-self-test.mjs
          node tools/discovery/information-routing-self-test.mjs
          node tools/discovery/readiness-report-self-test.mjs
          node tools/discovery/trust-calibration-self-test.mjs
          node tools/discovery/learned-source-self-test.mjs
          node tools/discovery/cold-start-self-test.mjs
          node tools/discovery/wikidata-bootstrap-self-test.mjs
          node tools/discovery/wikidata-series-expansion-self-test.mjs
          node tools/discovery/series-learning-self-test.mjs
          node tools/discovery/series-record-self-test.mjs
          node tools/discovery/publishable-readiness-self-test.mjs
          node tools/discovery/self-test.mjs
          node tools/discovery/candidate-title-self-test.mjs
          node tools/discovery/verification-link-self-test.mjs
          node tools/discovery/quality-self-test.mjs
          node tools/discovery/source-family-self-test.mjs
          node tools/discovery/common-evidence-self-test.mjs
          node tools/discovery/structured-evidence-self-test.mjs
          node tools/discovery/entity-resolution-self-test.mjs
          node tools/discovery/taxonomy-self-test.mjs
          node tools/gemini/quota-self-test.mjs
          node tools/gemini/self-test.mjs
          node tools/validate/pre-gemini-audit.mjs

      - name: Open or resume bounded cycle
        id: cycle_open
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${CYCLE_ACTION}" == "start" ]]; then
            node tools/discovery/cycle.mjs start
          else
            node tools/discovery/cycle.mjs status
          fi

      - name: Run one bounded discovery plus deep-research batch
        if: ${{ steps.cycle_open.outputs.active == 'true' }}
        run: |
          node tools/discovery/run.mjs \
            --max-pages 100 \
            --max-research-pages 100 \
            --max-depth 12 \
            --per-host-limit 100

      - name: Record confirmed-work progress and inactivity
        if: ${{ steps.cycle_open.outputs.active == 'true' }}
        id: checkpoint
        run: node tools/discovery/cycle.mjs checkpoint

      - name: Stage confirmed works and build one 500-work public CSV when ready
        if: ${{ steps.cycle_open.outputs.active == 'true' }}
        id: collect
        run: node tools/collect/run.mjs --input discovery --mode initial --gemini false

      - name: Read final cycle state
        id: cycle_final
        run: node tools/discovery/cycle.mjs status

      - name: Validate public data
        run: |
          if [[ -d data ]]; then
            node tools/validate/data-validator.mjs data
          else
            echo 'No complete 500-work public package yet; confirmed works remain under confirmed/.'
          fi

      - name: Commit state, confirmed CSV, and validated public data atomically
        shell: bash
        run: |
          set -euo pipefail
          base_sha="$(git rev-parse HEAD)"
          git add -A crawler/state.json crawler/research-cycle.json
          if [[ -d crawler/state-shards ]]; then git add -A crawler/state-shards; fi
          if [[ -d confirmed ]]; then git add -A confirmed; fi
          if [[ -d data ]]; then git add -A data; fi

          unexpected="$(git status --porcelain | awk '$2 != "crawler/state.json" && $2 !~ /^crawler\/state-shards\// && $2 != "crawler/research-cycle.json" && $2 !~ /^confirmed\// && $2 !~ /^data\// {print}')"
          if [[ -n "${unexpected}" ]]; then
            echo 'Unexpected files changed; refusing production commit.' >&2
            echo "${unexpected}" >&2
            exit 1
          fi

          if git diff --cached --quiet; then
            echo 'No state, confirmed CSV, or public data changes to commit.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Checkpoint bounded anime research cycle'

          for attempt in 1 2 3; do
            git fetch origin main
            remote_head="$(git rev-parse origin/main)"
            if [[ "${remote_head}" != "${base_sha}" ]]; then
              if ! git diff --quiet "${base_sha}..${remote_head}" -- crawler/state.json crawler/state-shards crawler/research-cycle.json confirmed data; then
                echo 'Production state/data advanced concurrently; refusing overwrite.' >&2
                exit 1
              fi
              git rebase origin/main
              base_sha="${remote_head}"
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
          done

          echo 'Could not publish production checkpoint without force push.' >&2
          exit 1

      - name: Dispatch next bounded batch while research work remains
        if: ${{ steps.cycle_final.outputs.active == 'true' && steps.checkpoint.outputs.work_remaining == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run research-production.yml --ref main -f cycle_action=continue

      - name: Verify published CSV is reachable from Pages
        if: ${{ steps.collect.outputs.csv_created == 'true' }}
        shell: bash
        env:
          MANIFEST_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/manifest.csv
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error --location "${MANIFEST_URL}" --output /tmp/manifest.csv; then
              if grep -Eq '^(initial-[0-9]{3}|[0-9]{4}-Q[1-4])\.csv\r?$' /tmp/manifest.csv; then
                echo "Pages data manifest is reachable: ${MANIFEST_URL}"
                exit 0
              fi
            fi
            sleep 15
          done
          echo "Pages did not expose the committed manifest within five minutes: ${MANIFEST_URL}" >&2
          exit 1
