name: Anime Research Production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/research-production.yml'

permissions:
  contents: write

concurrency:
  group: anime-production-launch
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DISCOVERY_MIN_DELAY_MS: '1000'
      RESEARCH_CANDIDATE_CHECKPOINT: '1000'
      READY_RECORD_CHECKPOINT: '450'

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Production preflight
        run: |
          set -euo pipefail
          node tools/collect/self-test.mjs
          node tools/collect/initial-budget-self-test.mjs
          node tools/discovery/known-work-wasm-self-test.mjs
          node tools/discovery/known-work-skip-self-test.mjs
          node tools/discovery/research-strategy-self-test.mjs
          node tools/discovery/trust-calibration-self-test.mjs
          node tools/discovery/self-test.mjs
          node tools/discovery/candidate-title-self-test.mjs
          node tools/discovery/verification-link-self-test.mjs
          node tools/discovery/quality-self-test.mjs
          node tools/discovery/source-family-self-test.mjs
          node tools/discovery/common-evidence-self-test.mjs
          node tools/discovery/structured-evidence-self-test.mjs
          node tools/discovery/entity-resolution-self-test.mjs
          node tools/discovery/taxonomy-self-test.mjs
          node tools/gemini/quota-self-test.mjs
          node tools/gemini/self-test.mjs
          node tools/validate/pre-gemini-audit.mjs

      - name: Learn research strategy to checkpoint
        shell: bash
        run: |
          set -euo pipefail

          state_counts() {
            node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { loadColumns } from './tools/csv/csv.mjs';
          import { loadDiscoveryState } from './tools/discovery/state.mjs';
          import { readyDiscoveryRecords } from './tools/discovery/to-record.mjs';
          const root = process.cwd();
          const state = loadDiscoveryState(path.join(root, 'crawler', 'state.json'));
          const columns = loadColumns(root);
          const { records } = readyDiscoveryRecords(state, columns, new Date().toISOString().slice(0, 10));
          const output = {
            candidates: Array.isArray(state.candidates) ? state.candidates.length : 0,
            frontier: Array.isArray(state.frontier) ? state.frontier.length : 0,
            ready: records.length
          };
          process.stdout.write(JSON.stringify(output));
          NODE
          }

          batch=0
          while true; do
            counts="$(state_counts)"
            candidates="$(node -e 'const x=JSON.parse(process.argv[1]);process.stdout.write(String(x.candidates))' "${counts}")"
            frontier="$(node -e 'const x=JSON.parse(process.argv[1]);process.stdout.write(String(x.frontier))' "${counts}")"
            ready="$(node -e 'const x=JSON.parse(process.argv[1]);process.stdout.write(String(x.ready))' "${counts}")"

            echo "checkpoint status: candidates=${candidates}, ready=${ready}, frontier=${frontier}"

            if (( candidates >= RESEARCH_CANDIDATE_CHECKPOINT )); then
              echo "Candidate checkpoint ${RESEARCH_CANDIDATE_CHECKPOINT} reached; finalizing."
              break
            fi
            if (( ready >= READY_RECORD_CHECKPOINT )); then
              echo "Ready-record checkpoint ${READY_RECORD_CHECKPOINT} reached; finalizing."
              break
            fi
            if (( frontier == 0 )); then
              echo 'Research frontier is empty; finalizing.'
              break
            fi

            before="$(sha256sum crawler/state.json | awk '{print $1}')"
            batch=$((batch + 1))
            echo "=== research batch ${batch}; candidates=${candidates}; frontier=${frontier} ==="

            node tools/discovery/run.mjs \
              --max-pages 100 \
              --max-depth 12 \
              --per-host-limit 100

            after="$(sha256sum crawler/state.json | awk '{print $1}')"
            if [[ "${before}" == "${after}" ]]; then
              echo 'No research-state progress in this batch; stopping to avoid waste.'
              break
            fi
          done

          echo "final checkpoint: $(state_counts)"

      - name: Build initial production CSV without Gemini
        run: node tools/collect/run.mjs --input discovery --mode initial --gemini false

      - name: Validate production data
        run: |
          if [[ -d data ]]; then
            node tools/validate/data-validator.mjs data
          else
            echo 'No record passed the confirmation gate yet; preserving learned research state.'
          fi

      - name: Commit learned state and validated data
        shell: bash
        run: |
          set -euo pipefail
          base_sha="$(git rev-parse HEAD)"
          git add crawler/state.json
          if [[ -d data ]]; then git add data; fi

          unexpected="$(git status --porcelain | awk '$2 != "crawler/state.json" && $2 !~ /^data\// {print}')"
          if [[ -n "${unexpected}" ]]; then
            echo 'Unexpected files changed; refusing production commit.' >&2
            echo "${unexpected}" >&2
            exit 1
          fi

          if git diff --cached --quiet; then
            echo 'No learned-state or data changes to commit.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Checkpoint anime research learning and validated data'

          for attempt in 1 2 3; do
            git fetch origin main
            remote_head="$(git rev-parse origin/main)"
            if [[ "${remote_head}" != "${base_sha}" ]]; then
              if ! git diff --quiet "${base_sha}..${remote_head}" -- crawler/state.json data; then
                echo 'Production state/data advanced concurrently; refusing overwrite.' >&2
                exit 1
              fi
              git rebase origin/main
              base_sha="${remote_head}"
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
          done

          echo 'Could not publish production checkpoint without force push.' >&2
          exit 1
