<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>全作品 | 日本アニメ総合検索</title>
  <link rel="stylesheet" href="./assets/css/common.css" />
  <link rel="stylesheet" href="./assets/css/all.css" />
</head>
<body data-page="all">
  <header class="site-header">
    <a class="brand" href="./index.html" aria-label="日本アニメ総合検索 ホーム">
      <span class="brand-mark">あ</span><span class="brand-text">日本アニメ総合検索</span>
    </a>
    <nav class="desktop-nav" aria-label="メインナビゲーション">
      <a href="./search.html">検索</a>
      <a class="active" href="./all.html" aria-current="page">全作品</a>
    </nav>
  </header>

  <main class="section-shell page-main">
    <div class="page-heading heading-row">
      <div>
        <span class="eyebrow">ALL TITLES</span>
        <h1>全作品</h1>
        <p>登録されている全作品を、この専用ページだけで読み込みます。トップ・検索・詳細ページでは全件データを読み込みません。</p>
      </div>
      <div class="sort-controls" aria-label="全作品の並び替え">
        <label for="all-sort-key">並び替え
          <select id="all-sort-key">
            <option value="season">四季順</option>
            <option value="date">年代順</option>
            <option value="title">タイトル順</option>
            <option value="studio">制作会社名順</option>
            <option value="episodes">話数順</option>
            <option value="runtime">総時間順</option>
          </select>
        </label>
        <button id="all-sort-direction" type="button" data-dir="asc" aria-label="昇順・降順切り替え">↑ 昇順</button>
      </div>
    </div>

    <div class="status-banner idle" id="all-status" role="status" aria-live="polite">
      <span class="status-icon" aria-hidden="true">○</span>
      <div>
        <strong>全件表示エンジンを準備しています</strong>
        <small>このページでだけ all.wasm と作品CSVを読み込みます。</small>
      </div>
    </div>

    <section id="all-results" class="anime-grid" aria-live="polite" aria-busy="false">
      <div class="empty-state card-surface full-width">
        <div class="empty-icon" aria-hidden="true">▦</div>
        <h2>ここに全作品が並びます</h2>
        <p>内部では一定件数ずつ段階描画し、他の3ページへ全件処理を持ち込みません。</p>
      </div>
    </section>
  </main>

  <footer class="site-footer"><span>日本アニメ総合検索</span></footer>
  <nav class="mobile-nav" aria-label="モバイルナビゲーション">
    <a href="./index.html"><span aria-hidden="true">⌂</span>ホーム</a>
    <a href="./search.html"><span aria-hidden="true">⌕</span>検索</a>
    <a class="active" href="./all.html" aria-current="page"><span aria-hidden="true">▦</span>全作品</a>
  </nav>
  <script src="./assets/js/common.js"></script>
  <script src="./assets/js/wasm-runtime.js"></script>
  <script src="./assets/js/all-bridge.js"></script>
</body>
</html>
