<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>日本アニメ総合検索</title>
  <link rel="stylesheet" href="./assets/css/common.css" />
  <link rel="stylesheet" href="./assets/css/top.css" />
</head>
<body data-page="top">
  <header class="site-header">
    <a class="brand" href="./" aria-label="日本アニメ総合検索 ホーム">
      <span class="brand-mark">あ</span><span class="brand-text">日本アニメ総合検索</span>
    </a>
    <nav class="desktop-nav" aria-label="メインナビゲーション">
      <a href="./search/">検索</a>
      <a href="./all/">全作品</a>
    </nav>
  </header>

  <main>
    <section class="hero section-shell">
      <div class="hero-decor decor-a"></div>
      <div class="hero-decor decor-b"></div>
      <div class="hero-copy">
        <span class="eyebrow">ANIME SEARCH</span>
        <h1>日本アニメを、<br><span>もっと探しやすく。</span></h1>
        <p>作品名だけじゃない。声優、スタッフ、制作会社、配信先など、いろんな条件から探せる総合検索サイト。</p>
      </div>

      <form class="hero-search" action="./search/" method="get">
        <label class="sr-only" for="q">アニメを検索</label>
        <div class="search-box large">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input id="q" name="q" type="search" placeholder="作品名・声優・制作会社・スタッフなどから検索" autocomplete="off" />
          <button type="submit">検索</button>
        </div>
      </form>

      <div class="entry-grid">
        <a class="entry-card blue" href="./search/">
          <div class="entry-icon">⌕</div>
          <div><strong>アニメを検索</strong><span>条件を指定して探す</span></div>
          <span class="entry-arrow">→</span>
        </a>
        <a class="entry-card pink" href="./all/">
          <div class="entry-icon">▦</div>
          <div><strong>全作品を見る</strong><span>登録作品をまとめて見る</span></div>
          <span class="entry-arrow">→</span>
        </a>
      </div>
    </section>

    <section class="feature-strip section-shell" aria-label="サイトの特徴">
      <article><span>◎</span><div><strong>いろいろ検索</strong><small>保存されている情報を横断して探せる</small></div></article>
      <article><span>⇅</span><div><strong>見やすく並べ替え</strong><small>6種類の共通ソートに対応</small></div></article>
      <article><span>♡</span><div><strong>見やすい詳細</strong><small>大量の情報もカテゴリごとに整理</small></div></article>
    </section>
  </main>

  <footer class="site-footer"><span>日本アニメ総合検索</span></footer>
  <nav class="mobile-nav" aria-label="モバイルナビゲーション">
    <a class="active" href="./"><span>⌂</span>ホーム</a>
    <a href="./search/"><span>⌕</span>検索</a>
    <a href="./all/"><span>▦</span>全作品</a>
  </nav>
  <script src="./assets/js/common.js"></script>
</body>
</html>
